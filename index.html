<!DOCTYPE html>
 <html lang="en">
<head>
    <meta charset="UTF-8">
    <title> My ToDo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
        <h1> My Todo List</h1>
        <p id="task-counter">0 tasks remaining</p>

        <div class="input-row">
            <input type="text" id="todo-input" placeholder="What do you need to do?">
            <button id="add-btn">Add</button> 

        </div>
        
        <button id="clear-btn">Clear Completed</button>

        <ul id="todo-list"></ul>
        <p id="empty-msg"> Nothing here yet - add your first task</p>

    </div>
    <script src="script.js"></script>
</body>
</html>
